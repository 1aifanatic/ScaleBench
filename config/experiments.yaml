# Benchmark experiments configuration
# Each experiment specifies model, dataset, task, and optional metrics.

upload_to_hf: false

# MLflow configuration (optional)
# Enable via CLI: --mlflow, disable: --no-mlflow
mlflow:
  enabled: false  # Set to true to enable MLflow tracking
  tracking_uri: "http://127.0.0.1:5000"
  experiment_name: "ScaleDown"

# Parallel processing configuration (optional)
# Enables concurrent processing of examples to speed up benchmarking
parallel:
  enabled: true  # Set to true to enable parallel processing
  max_workers: 5  # Maximum concurrent API requests (adjust based on rate limits)
  retry_attempts: 5  # Number of retry attempts on rate limit errors
  retry_base_delay: 2.0  # Base delay for exponential backoff (seconds)
  retry_max_delay: 60.0  # Maximum delay cap (seconds)

experiments:
  # HotpotQA baseline and ScaleDown experiments
  - id: hotpotqa_baseline_openai
    model:
      name: openai:gpt-4o
      mode: baseline
    dataset:
      name: hotpotqa
      split: validation
      num_examples: 10
      seed: 42
    task:
      name: rag_qa
    metrics:
      - exact_match
      - f1

  - id: hotpotqa_scaledown_openai
    model:
      name: openai:gpt-4o
      mode: scaledown
      scaledown:
        rate: auto
        compression_model: gemini-2.5-flash
    dataset:
      name: hotpotqa
      split: validation
      num_examples: 10
      seed: 42
    task:
      name: rag_qa
    metrics:
      - exact_match
      - f1

  # LongBench baseline single-task evaluation
  - id: longbench_narrativeqa_baseline_openai
    model:
      name: openai:gpt-4o
      mode: baseline
    dataset:
      name: longbench
      split: test
      task: narrativeqa
      num_examples: 10
      seed: 42
    task:
      name: rag_qa
    metrics:
      - f1
      - bertscore

  # LongBench scaledown single-task evaluation
  - id: longbench_narrativeqa_scaledown_openai
    model:
      name: openai:gpt-4o
      mode: scaledown
      scaledown:
        rate: auto
        compression_model: gemini-2.5-flash
    dataset:
      name: longbench
      split: test
      task: narrativeqa
      num_examples: 10
      seed: 42
    task:
      name: rag_qa
    metrics:
      - f1
      - bertscore

  # ETHIC Recalling baseline
  - id: ethic_recalling_baseline_openai
    model:
      name: openai:gpt-4o
      mode: baseline
    dataset:
      name: ethic:Recalling
      split: test
      num_examples: 10
      seed: 42
    task:
      name: rag_qa
    metrics:
      - set_exact_match
      - set_precision
      - set_recall
      - set_f1

  # ETHIC Recalling scaledown
  - id: ethic_recalling_scaledown_openai
    model:
      name: openai:gpt-4o
      mode: scaledown
      scaledown:
        rate: auto
        compression_model: gemini-2.5-flash
    dataset:
      name: ethic:Recalling
      split: test
      num_examples: 10
      seed: 42
    task:
      name: rag_qa
    metrics:
      - set_exact_match
      - set_precision
      - set_recall
      - set_f1

  # MS-MARCO v2.1 baseline - passage retrieval + answer QA
  - id: msmarco_baseline_openai
    model:
      name: openai:gpt-4o
      mode: baseline
    dataset:
      name: msmarco
      split: validation
      num_examples: 10
      seed: 42
    task:
      name: retrieval_task
    metrics:
      - exact_match
      - f1
      - bertscore
      - retrieval_precision
      - retrieval_recall
      - retrieval_f1
    combined_score_weights:
      answer_weight: 0.7
      retrieval_weight: 0.3

  # MS-MARCO v2.1 scaledown - passage retrieval + answer QA
  - id: msmarco_scaledown_openai
    model:
      name: openai:gpt-4o
      mode: scaledown
      scaledown:
        rate: auto
        compression_model: gemini-2.5-flash
    dataset:
      name: msmarco
      split: validation
      num_examples: 10
      seed: 42
    task:
      name: retrieval_task
    metrics:
      - exact_match
      - f1
      - bertscore
      - retrieval_precision
      - retrieval_recall
      - retrieval_f1
    combined_score_weights:
      answer_weight: 0.7
      retrieval_weight: 0.3