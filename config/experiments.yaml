# Benchmark experiments configuration
# Each experiment specifies model, dataset, task, and optional metrics.

experiments:
  # HotpotQA baseline and ScaleDown experiments
  - id: hotpotqa_baseline_openai_fullwiki
    model:
      name: openai:gpt-4o
      mode: baseline
    dataset:
      name: hotpotqa:fullwiki
      split: validation
    task:
      name: rag_qa
    metrics:
      - exact_match
      - f1

  - id: hotpotqa_scaledown_openai_fullwiki
    model:
      name: openai:gpt-4o
      mode: scaledown
      scaledown:
        rate: auto
    dataset:
      name: hotpotqa:fullwiki
      split: validation
    task:
      name: rag_qa
    metrics:
      - exact_match
      - f1
