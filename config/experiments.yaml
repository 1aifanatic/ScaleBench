# Benchmark experiments configuration
# Each experiment specifies model, dataset, task, and optional metrics.

experiments:
  - id: baseline_gemini_longbench_narrativeqa
    model:
      name: gemini:2.0-flash
      mode: baseline
    dataset:
      name: longbench:narrativeqa
      split: test
      num_examples: 10
      seed: 42
    task:
      name: longdoc_qa
    metrics:
      - f1
      - rouge_l

  - id: baseline_openai_longbench_narrativeqa
    model:
      name: openai:gpt-4-turbo
      mode: baseline
    dataset:
      name: longbench:narrativeqa
      split: test
      num_examples: 10
      seed: 42
    task:
      name: longdoc_qa
    metrics:
      - f1
      - rouge_l

  - id: baseline_gemini_hotpotqa
    model:
      name: gemini:2.0-flash
      mode: baseline
    dataset:
      name: hotpotqa
      split: test
      num_examples: 5
      seed: 42
    task:
      name: rag_task
    metrics:
      - f1
      - exact_match

  - id: scaledown_auto_openai_longbench_narrativeqa
    model:
      name: openai:gpt-4-turbo
      mode: scaledown
      scaledown:
        rate: auto
    dataset:
      name: longbench:narrativeqa
      split: test
      num_examples: 10
      seed: 42
    task:
      name: longdoc_qa
    metrics:
      - f1
      - rouge_l
