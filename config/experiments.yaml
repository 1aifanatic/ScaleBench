# Benchmark experiments configuration
# Each experiment specifies model, dataset, task, and optional metrics.

experiments:
  # HotpotQA baseline and ScaleDown experiments
  - id: hotpotqa_baseline_openai
    model:
      name: openai:gpt-4o
      mode: baseline
    dataset:
      name: hotpotqa
      split: validation
      num_examples: 10
      seed: 42
    task:
      name: rag_qa
    metrics:
      - exact_match
      - f1

  - id: hotpotqa_scaledown_openai
    model:
      name: openai:gpt-4o
      mode: scaledown
      scaledown:
        rate: auto
        compression_model: gemini-2.5-flash
    dataset:
      name: hotpotqa
      split: validation
      num_examples: 10
      seed: 42
    task:
      name: rag_qa
    metrics:
      - exact_match
      - f1

  # LongBench baseline single-task evaluation
  - id: longbench_narrativeqa_baseline_openai
    model:
      name: openai:gpt-4o
      mode: baseline
    dataset:
      name: longbench
      split: test
      task: narrativeqa
      num_examples: 10
      seed: 42
    task:
      name: rag_qa
    metrics:
      - f1
      - bertscore

  # LongBench scaledown single-task evaluation
  - id: longbench_narrativeqa_scaledown_openai
    model:
      name: openai:gpt-4o
      mode: scaledown
      scaledown:
        rate: auto
        compression_model: gemini-2.5-flash
    dataset:
      name: longbench
      split: test
      task: narrativeqa
      num_examples: 10
      seed: 42
    task:
      name: rag_qa
    metrics:
      - f1
      - bertscore
