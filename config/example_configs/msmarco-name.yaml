# Benchmark experiments configuration
# Each experiment specifies model, dataset, task, and optional metrics.

upload_to_hf: true

# MLflow configuration (optional)
# Enable via CLI: --mlflow, disable: --no-mlflow
mlflow:
  enabled: true  # Set to true to enable MLflow tracking
  tracking_uri: "http://127.0.0.1:5000"
  experiment_name: "ScaleDown"

experiments:
  # MS-MARCO v2.1 baseline - passage retrieval + answer QA
  - id: msmarco_full_baseline_openai
    model:
      name: openai:gpt-4o
      mode: baseline
    dataset:
      name: msmarco
      split: validation
    task:
      name: retrieval_task
    metrics:
      - f1
      - bertscore
      - retrieval_precision
      - retrieval_recall
      - retrieval_f1
    combined_score_weights:
      answer_weight: 0.7
      retrieval_weight: 0.3

  # MS-MARCO v2.1 scaledown - passage retrieval + answer QA
  - id: msmarco_full_scaledown_openai
    model:
      name: openai:gpt-4o
      mode: scaledown
      scaledown:
        rate: auto
        compression_model: gemini-2.5-flash
    dataset:
      name: msmarco
      split: validation
    task:
      name: retrieval_task
    metrics:
      - f1
      - bertscore
      - retrieval_precision
      - retrieval_recall
      - retrieval_f1
    combined_score_weights:
      answer_weight: 0.7
      retrieval_weight: 0.3