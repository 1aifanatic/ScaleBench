# Benchmark experiments configuration
# Each experiment specifies model, dataset, task, and optional metrics.

upload_to_hf: true

# MLflow configuration (optional)
# Enable via CLI: --mlflow, disable: --no-mlflow
mlflow:
  enabled: true  # Set to true to enable MLflow tracking
  tracking_uri: "http://127.0.0.1:5000"
  experiment_name: "ScaleDown" # narrativeqa, qasper, multifieldqa_en, 2wikimqa

experiments:
  # LongBench baseline full dataset evaluation
  - id: longbench_full_narrativeqa_baseline_openai
    model:
      name: openai:gpt-4o
      mode: baseline
    dataset:
      name: longbench
      split: test
      task: narrativeqa
    task:
      name: rag_qa
    metrics:
      - f1
      - bertscore

  # LongBench scaledown full dataset evaluation
  - id: longbench_full_narrativeqa_scaledown_openai
    model:
      name: openai:gpt-4o
      mode: scaledown
      scaledown:
        rate: auto
        compression_model: gemini-2.5-flash
    dataset:
      name: longbench
      split: test
      task: narrativeqa
    task:
      name: rag_qa
    metrics:
      - f1
      - bertscore

  - id: longbench_full_2wikimqa_baseline_openai
